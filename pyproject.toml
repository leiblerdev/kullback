[project]
name = "harness"
version = "0.1.0"
description = "Leibler Harness: Builder turns customer traces into an Environment, Runner re-executes Runs and computes Verdicts."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = [
    "mutmut>=3.7.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: reads the full raw corpus in ../data/raw"]

[tool.mutmut]
source_paths = ["src/harness/"]
pytest_add_cli_args_test_selection = ["tests/"]
