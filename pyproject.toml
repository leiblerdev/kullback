[project]
name = "harness"
version = "0.1.0"
description = "Leibler Harness: Builder turns customer traces into an Environment, Runner re-executes Runs and computes Verdicts."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = [
    "mutmut>=3.7.0",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: reads the full raw corpus in ../data/raw"]

[tool.mutmut]
source_paths = ["src/harness/"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
