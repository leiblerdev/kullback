repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (package dependency direction)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^(kullback/.*\.py|pyproject\.toml)$
