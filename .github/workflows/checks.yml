name: checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
      TERM: dumb
      COLUMNS: "120"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - name: mechanical branch checks
        run: uv run python scripts/branch_checks.py origin/${{ github.base_ref }} HEAD
      - name: lint
        run: uv run ruff check kullback
      - name: top level tests
        run: uv run pytest tests/*.py -q -x --ignore=tests/test_e2e.py
      - name: end to end tests
        run: uv run pytest tests/test_e2e.py -q -x
      - name: unit tests by directory
        run: for d in tests/*/; do case "$d" in tests/fixtures/|tests/__pycache__/) continue;; esac; uv run pytest "$d" -q -x; done
      - name: hub tests
        run: uv run pytest tests/hub -q -x
